<!doctype html>

<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050605">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ZM Studio">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>ZM Studio</title>
    <link rel="manifest" href="/bridge/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/assets/brand/zm-favicon.svg">
    <link rel="apple-touch-icon" href="/assets/brand/zm-app-180.png">
    <link rel="stylesheet" href="/bridge/styles.css">
    <link rel="stylesheet" href="/bridge/salas.css">
  </head>
  <body class="salas">
    <header class="salas-top">
      <span class="salas-brand" aria-label="ZM Studio">
        <svg class="brand-logo" viewBox="-4.8 -4.8 377.1 49.6" aria-hidden="true"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><g class="pulse" transform="translate(0 0) scale(2.5) translate(0 -2)"><path class="beat" d="M7 2H23L7 18H31V2L41 12L51 2V18" stroke-width="1.92" pathLength="100"/><circle class="beat-dot" cx="60" cy="10" r="3" stroke="none"/></g><g class="word" transform="translate(193.5 7)" stroke-width="4.8"><path transform="translate(0 0)" d="M26 0H6.5A6.5 6.5 0 0 0 6.5 13H19.5A6.5 6.5 0 0 1 19.5 26H0"/><path transform="translate(36 0)" d="M0 0H24M12 0V26"/><path transform="translate(70 0)" d="M0 0V15A11 11 0 0 0 22 15V0"/><path transform="translate(102 0)" d="M0 0H11A13 13 0 0 1 11 26H0Z"/><path transform="translate(136 0)" d="M0 0V26"/><path transform="translate(146 0)" d="M13 0A13 13 0 0 1 13 26A13 13 0 0 1 13 0Z"/></g></g></svg>
      </span>
      <span id="salas-mac" class="salas-mac"></span>
      <button id="salas-stop" class="salas-stop" type="button" hidden>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-icon="stop"><rect x="5.4" y="5.4" width="9.2" height="9.2" rx="2.6" fill="currentColor" stroke="none"/></svg>
        <span>Stop all</span>
      </button>
    </header>
    <main class="salas-main">
      <button id="salas-continue" class="salas-continue" type="button" hidden></button>
      <h1 class="salas-title">Home</h1>
      <ul id="salas-list" class="salas-list" aria-live="polite"></ul>
      <p id="salas-empty" class="salas-empty" hidden></p>
      <p id="salas-foot" class="salas-foot"></p>
    </main>
    <div id="salas-welcome" class="salas-welcome" hidden role="dialog" aria-modal="true" aria-labelledby="salas-welcome-title">
      <section class="salas-sheet">
        <span class="salas-check" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-icon="check"><path d="M4.6 10.4l3.6 3.6 7.2-7.6"/></svg></span>
        <h2 id="salas-welcome-title"></h2>
        <p id="salas-welcome-text"></p>
        <ol id="salas-welcome-steps" class="salas-steps"></ol>
        <button id="salas-welcome-ok" class="salas-primary" type="button"></button>
      </section>
    </div>
    <script type="module" src="/bridge/salas.js"></script>
  </body>
</html>
